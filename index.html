<body>
    <h2>📱 Tính toán sản phẩm</h2>

    <table>
        <tr>
            <th></th>
            <th>Cuộn 1</th>
            <th>Cuộn 2</th>
            <th>Cuộn 3</th>
            <th>Tổng</th>
        </tr>

        <tr>
            <td>Hàng ra</td>
            <td><input id="ra1" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td><input id="ra2" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td><input id="ra3" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td id="tongRa">0</td>
        </tr>

        <tr>
            <td>Hàng làm</td>
            <td><input id="lam1" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td><input id="lam2" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td><input id="lam3" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhToan()"></td>
            <td id="tongLam">0</td>
        </tr>

        <tr>
            <td>Hàng hỏng</td>
            <td id="hong1">0</td>
            <td id="hong2">0</td>
            <td id="hong3">0</td>
            <td id="tongHong">0</td>
        </tr>
    </table>

    <div class="percent-display">
        Phần trăm làm được: <span id="phanTram">0</span>%
    </div>

    <div class="input-group">
        <h3>📊 Nhập theo % (tự sinh dữ liệu)</h3>
        <div class="input-row">
            <label>Tổng làm được:</label>
            <input id="lamTongNhap" type="number" pattern="[0-9]*" inputmode="numeric" oninput="tinhNguoc()">
        </div>
        <div class="input-row">
            <label>Phần trăm (%):</label>
            <input id="phanTramNhap" type="number" step="0.1" inputmode="decimal" oninput="tinhNguoc()">
        </div>
    </div>

    <div class="button-container">
        <button class="save-btn" onclick="luuDuLieu()">💾 Lưu</button>
        <button class="delete-btn" onclick="xoaTatCa()">🗑️ Xóa tất cả</button>
    </div>

    <h3>📋 Dữ liệu đã lưu</h3>
    <div id="dsLuu"></div>

    <script>
        const ra1 = document.getElementById("ra1");
        const ra2 = document.getElementById("ra2");
        const ra3 = document.getElementById("ra3");
        const lam1 = document.getElementById("lam1");
        const lam2 = document.getElementById("lam2");
        const lam3 = document.getElementById("lam3");

        // Tự động focus vào ô đầu tiên khi trang load
        window.onload = function() {
            ra1.focus();
        };

        function tinhToan() {
            let r1 = +ra1.value || 0, r2 = +ra2.value || 0, r3 = +ra3.value || 0;
            let l1 = +lam1.value || 0, l2 = +lam2.value || 0, l3 = +lam3.value || 0;

            // Giới hạn số âm
            r1 = Math.max(0, r1);
            r2 = Math.max(0, r2);
            r3 = Math.max(0, r3);
            l1 = Math.max(0, l1);
            l2 = Math.max(0, l2);
            l3 = Math.max(0, l3);

            let tongRa = r1 + r2 + r3;
            let tongLam = l1 + l2 + l3;

            document.getElementById("tongRa").innerText = tongRa;
            document.getElementById("tongLam").innerText = tongLam;

            document.getElementById("hong1").innerText = Math.max(0, r1 - l1);
            document.getElementById("hong2").innerText = Math.max(0, r2 - l2);
            document.getElementById("hong3").innerText = Math.max(0, r3 - l3);
            document.getElementById("tongHong").innerText = Math.max(0, tongRa - tongLam);

            document.getElementById("phanTram").innerText =
                tongRa ? (tongLam / tongRa * 100).toFixed(2) : 0;
        }

        /* ===== TÍNH NGƯỢC – DAO ĐỘNG % ===== */
        function tinhNguoc() {
            let tongLam = +lamTongNhap.value || 0;
            let pTB = +phanTramNhap.value || 0;
            
            if (!tongLam || !pTB) return;

            let d1 = Math.random() * 1.2 - 0.6;
            let d2 = Math.random() * 1.2 - 0.6;

            let p1 = pTB + d1;
            let p2 = pTB + d2;
            let p3 = pTB * 3 - p1 - p2;

            // Đảm bảo phần trăm không âm
            p1 = Math.max(0, p1);
            p2 = Math.max(0, p2);
            p3 = Math.max(0, p3);

            let l1 = Math.round(tongLam / 3);
            let l2 = Math.round(tongLam / 3);
            let l3 = tongLam - l1 - l2;

            // Đảm bảo không âm
            l1 = Math.max(0, l1);
            l2 = Math.max(0, l2);
            l3 = Math.max(0, l3);

            lam1.value = l1;
            lam2.value = l2;
            lam3.value = l3;

            ra1.value = p1 ? Math.round(l1 / (p1 / 100)) : 0;
            ra2.value = p2 ? Math.round(l2 / (p2 / 100)) : 0;
            ra3.value = p3 ? Math.round(l3 / (p3 / 100)) : 0;

            tinhToan();
        }

        /* ===== LƯU DỮ LIỆU ===== */
        function luuDuLieu() {
            // Kiểm tra nếu không có dữ liệu
            if (!ra1.value && !ra2.value && !ra3.value && 
                !lam1.value && !lam2.value && !lam3.value) {
                alert("Vui lòng nhập dữ liệu trước khi lưu!");
                return;
            }

            let data = {
                ra1: ra1.value || 0,
                ra2: ra2.value || 0,
                ra3: ra3.value || 0,
                lam1: lam1.value || 0,
                lam2: lam2.value || 0,
                lam3: lam3.value || 0,
                time: new Date().toLocaleString()
            };
            
            let ds = JSON.parse(localStorage.getItem("tonghang")) || [];
            ds.push(data);
            localStorage.setItem("tonghang", JSON.stringify(ds));
            
            hienThi();
            alert("Đã lưu dữ liệu!");
        }

        function hienThi() {
            let ds = JSON.parse(localStorage.getItem("tonghang")) || [];
            dsLuu.innerHTML = "";
            
            if (ds.length === 0) {
                dsLuu.innerHTML = &#39;<div class="saved-item">Chưa có dữ liệu</div>&#39;;
                return;
            }
            
            // Hiển thị theo thứ tự mới nhất lên đầu
            ds.reverse().forEach((d, i) => {
                dsLuu.innerHTML += `
                <div class="saved-item">
                    <span class="saved-time" onclick="load(${ds.length - 1 - i})">
                        📅 ${d.time}<br>
                        <small>Ra: ${d.ra1}/${d.ra2}/${d.ra3} | Làm: ${d.lam1}/${d.lam2}/${d.lam3}</small>
                    </span>
                    <span class="delete-icon" onclick="xoa(${ds.length - 1 - i})">❌</span>
                </div>`;
            });
        }

        function load(i) {
            let ds = JSON.parse(localStorage.getItem("tonghang")) || [];
            // Đảo ngược index vì đã reverse khi hiển thị
            let actualIndex = ds.length - 1 - i;
            let d = ds[actualIndex];
            
            ra1.value = d.ra1;
            ra2.value = d.ra2;
            ra3.value = d.ra3;
            lam1.value = d.lam1;
            lam2.value = d.lam2;
            lam3.value = d.lam3;
            tinhToan();
            
            // Cuộn lên đầu trang
            window.scrollTo(0, 0);
        }

        function xoa(i) {
            if (!confirm("Bạn có chắc muốn xóa dữ liệu này?")) return;
            
            let ds = JSON.parse(localStorage.getItem("tonghang")) || [];
            // Đảo ngược index vì đã reverse khi hiển thị
            let actualIndex = ds.length - 1 - i;
            ds.splice(actualIndex, 1);
            localStorage.setItem("tonghang", JSON.stringify(ds));
            hienThi();
        }

        function xoaTatCa() {
            if (!confirm("Bạn có chắc muốn xóa TẤT CẢ dữ liệu đã lưu?")) return;
            
            localStorage.removeItem("tonghang");
            hienThi();
            alert("Đã xóa tất cả dữ liệu!");
        }

        // Hiển thị dữ liệu đã lưu khi tải trang
        hienThi();
    </script>
</body>

<style>

<body>

<h2>📒 Ghi chép chi tiêu</h2>

<input id="newCategory" placeholder="Tên hạng mục mới">
<div class="buttons-row">
    <button class="add" onclick="addCategory()">
        <span class="icon">➕</span> Thêm hạng mục
    </button>
</div>

<div class="buttons-row">
    <button class="save" onclick="exportJSON()">
        <span class="icon">💾</span> Lưu dữ liệu (.json)
    </button>
    <button class="delete" onclick="clearAll()">
        <span class="icon">🗑️</span> Xóa toàn bộ dữ liệu
    </button>
</div>

<div id="categories"></div>
<div id="grandTotal">Tổng tất cả: 0</div>

<script>
let data = JSON.parse(localStorage.getItem("expenses")) || {};

function save(){ localStorage.setItem("expenses", JSON.stringify(data)); }

function addCategory(){
    const name = newCategory.value.trim();
    if(!name) return alert("Vui lòng nhập tên hạng mục!");
    if(data[name]) return alert("Hạng mục đã tồn tại!");
    
    data[name] = [];
    newCategory.value = "";
    save(); 
    render();
}

function deleteCategory(cat){
    if(confirm(`Xóa toàn bộ hạng mục "${cat}"?`)){
        delete data[cat];
        save(); 
        render();
    }
}

function addEntry(cat){
    const a = document.getElementById(`amount-${cat}`);
    const n = document.getElementById(`note-${cat}`);
    
    if(!a.value || parseFloat(a.value) <= 0) {
        alert("Vui lòng nhập số tiền hợp lệ!");
        a.focus();
        return;
    }

    data[cat].unshift({
        amount: parseFloat(a.value),
        note: n.value,
        time: new Date().toLocaleString("vi-VN")
    });
    
    a.value = ""; 
    n.value = "";
    save(); 
    render();
}

function editEntry(cat, i){
    const e = data[cat][i];
    const amount = prompt("Sửa số tiền:", e.amount);
    if(amount === null || amount === "") return;
    
    const note = prompt("Sửa ghi chú:", e.note);
    e.amount = parseFloat(amount);
    e.note = note;
    e.time = new Date().toLocaleString("vi-VN") + " (đã sửa)";
    
    save(); 
    render();
}

function deleteEntry(cat, i){
    if(confirm("Xóa khoản chi này?")){
        data[cat].splice(i,1);
        save(); 
        render();
    }
}

function clearAll(){
    if(confirm("Bạn có chắc chắn muốn XÓA TOÀN BỘ dữ liệu không?\nHành động này không thể hoàn tác!")){
        data = {};
        save(); 
        render();
    }
}

function exportJSON(){
    if(Object.keys(data).length === 0) {
        alert("Không có dữ liệu để xuất!");
        return;
    }
    
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `chi_tieu_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    
    alert("Dữ liệu đã được xuất thành công!");
}

function render(){
    const c = document.getElementById("categories");
    c.innerHTML = "";
    let grand = 0;

    if(Object.keys(data).length === 0) {
        c.innerHTML = `<div class="empty-state">Chưa có hạng mục nào. Hãy thêm hạng mục đầu tiên!</div>`;
        document.getElementById("grandTotal").innerText = "Tổng tất cả: 0";
        return;
    }

    for(let cat in data){
        let sum = 0;
        let html = `<div class="category">
            <div class="category-header">
                <h3 class="category-title">${cat}</h3>
                <button class="delete category-delete" onclick="deleteCategory(&#39;${cat}&#39;)">
                    <span class="icon">🗑️</span> Xóa hạng mục
                </button>
            </div>
            
            <div class="entry-form">
                <input id="amount-${cat}" type="number" placeholder="Số tiền" min="1">
                <textarea id="note-${cat}" placeholder="Ghi chú (có thể bỏ qua)" rows="2"></textarea>
                <button class="add" onclick="addEntry(&#39;${cat}&#39;)">
                    <span class="icon">➕</span> Thêm khoản chi
                </button>
            </div>`;

        if(data[cat].length === 0) {
            html += `<div class="empty-state">Chưa có khoản chi nào trong hạng mục này</div>`;
        } else {
            data[cat].forEach((e,i)=>{
                sum += e.amount;
                html += `<div class="entry">
                    <div class="entry-content">
                        <div class="entry-amount">💰 ${e.amount.toLocaleString()} VND</div>
                        ${e.note ? `<div class="entry-note">📝 ${e.note}</div>` : ""}
                        <div class="entry-time">⏰ ${e.time}</div>
                    </div>
                    <div class="entry-actions">
                        <button class="edit" onclick="editEntry(&#39;${cat}&#39;,${i})">
                            <span class="icon">✏️</span> Sửa
                        </button>
                        <button class="delete" onclick="deleteEntry(&#39;${cat}&#39;,${i})">
                            <span class="icon">❌</span> Xóa
                        </button>
                    </div>
                </div>`;
            });
        }

        grand += sum;
        html += `<div class="total">Tổng ${cat}: <span style="color:#27ae60">${sum.toLocaleString()} VND</span></div></div>`;
        c.innerHTML += html;
    }
    
    document.getElementById("grandTotal").innerText = `Tổng tất cả: ${grand.toLocaleString()} VND`;
}

// Khởi chạy ứng dụng
