<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>App Ghép HTML Hoàn Chỉnh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family: Arial, sans-serif; background:#f2f2f2 }
#toolbar {
    background:#1e1e1e; color:white; padding:10px;
}
#toolbar input, #toolbar button {
    margin:4px 4px 0 0;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    font-weight:bold;
}
.load { background:#2196F3; color:white }
.backup { background:#4CAF50; color:white }
.restore { background:#FF9800; color:white }
.reset { background:#f44336; color:white }
.export { background:#9C27B0; color:white }

#tabs {
    display:flex; overflow-x:auto; background:#333;
}
.tab {
    padding:10px 15px;
    color:#ccc;
    cursor:pointer;
    white-space:nowrap;
    border-right:1px solid #444;
}
.tab.active {
    background:#2196F3;
    color:white;
}

#content {
    height: calc(100vh - 140px);
}
iframe {
    width:100%;
    height:100%;
    border:none;
    display:none;
}
iframe.active { display:block }
</style>
</head>

<body>

<div id="toolbar">
    <input type="file" multiple accept=".html" onchange="loadFiles(this.files)">
    <br>
    <button class="backup" onclick="backupAll()">💾 Sao lưu (.json)</button>
    <button class="restore" onclick="document.getElementById('restoreFile').click()">♻️ Khôi phục</button>
    <button class="reset" onclick="resetAll()">🗑️ Reset tất cả</button>
    <button class="export" onclick="exportMergedHTML()">⬇️ Tải HTML hoàn chỉnh</button>
    <input type="file" id="restoreFile" accept=".json" hidden onchange="restoreAll(this.files[0])">
</div>

<div id="tabs"></div>
<div id="content"></div>

<script>
let tabCount = 0;
let frames = {};
let tabsMeta = [];

function loadFiles(files) {
    for (let file of files) createTab(file);
}

function createTab(file) {
    tabCount++;
    const id = "tab" + tabCount;

    const tab = document.createElement("div");
    tab.className = "tab";
    tab.textContent = file.name;
    tab.id = "btn_" + id;
    tab.onclick = () => activate(id);
    tabs.appendChild(tab);

    const iframe = document.createElement("iframe");
    iframe.id = id;

    const reader = new FileReader();
    reader.onload = e => iframe.srcdoc = e.target.result;
    reader.readAsText(file);

    content.appendChild(iframe);

    frames[id] = iframe;
    tabsMeta.push({ id, title: file.name });

    activate(id);
}

function activate(id) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll("iframe").forEach(f => f.classList.remove("active"));
    document.getElementById("btn_" + id).classList.add("active");
    document.getElementById(id).classList.add("active");
}

/* ===== BACKUP ===== */
function backupAll() {
    let data = {};
    for (let id in frames) {
        try { data[id] = { ...frames[id].contentWindow.localStorage }; }
        catch {}
    }
    downloadJSON(data, "backup_all_tabs.json");
}

/* ===== RESTORE ===== */
function restoreAll(file) {
    const r = new FileReader();
    r.onload = e => {
        const data = JSON.parse(e.target.result);
        for (let id in data) {
            if (frames[id]) {
                frames[id].contentWindow.localStorage.clear();
                for (let k in data[id]) {
                    frames[id].contentWindow.localStorage.setItem(k, data[id][k]);
                }
            }
        }
        alert("✅ Đã khôi phục xong – tải lại trang để áp dụng");
    };
    r.readAsText(file);
}

/* ===== RESET ===== */
function resetAll() {
    if (!confirm("XÓA TOÀN BỘ DỮ LIỆU CỦA TẤT CẢ TAB?")) return;
    for (let id in frames) {
        try { frames[id].contentWindow.localStorage.clear(); } catch {}
    }
    alert("🗑️ Đã reset toàn bộ dữ liệu");
}

/* ===== EXPORT HTML ===== */
function exportMergedHTML() {
    let payload = tabsMeta.map(t => ({
        id: t.id,
        title: t.title,
        html: frames[t.id].srcdoc
    }));

    const html = `
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>App HTML Đã Ghép</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial}
#tabs{display:flex;background:#333}
.tab{padding:10px;color:#ccc;cursor:pointer}
.tab.active{background:#2196F3;color:white}
iframe{width:100%;height:calc(100vh - 40px);border:none;display:none}
iframe.active{display:block}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="content"></div>
<script>
const data = ${JSON.stringify(payload)};
let frames={};
function init(){
data.forEach((t,i)=>{
 let tab=document.createElement("div");
 tab.className="tab";
 tab.textContent=t.title;
 tab.id="btn_"+t.id;
 tab.onclick=()=>activate(t.id);
 tabs.appendChild(tab);

 let f=document.createElement("iframe");
 f.id=t.id;
 f.srcdoc=t.html;
 content.appendChild(f);
 frames[t.id]=f;
 if(i===0) activate(t.id);
});
}
function activate(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll("iframe").forEach(f=>f.classList.remove("active"));
document.getElementById("btn_"+id).classList.add("active");
document.getElementById(id).classList.add("active");
}
init();
<\/script>
</body>
</html>`;
    downloadHTML(html, "app_html_hoan_chinh.html");
}

function downloadJSON(obj, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}));
    a.download = name;
    a.click();
}

function downloadHTML(text, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/html"}));
    a.download = name;
    a.click();
}
</script>

</body>
</html>
