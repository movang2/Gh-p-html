                <iframe srcdoc="<!DOCTYPE html>
<html lang=&quot;vi&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>Tính toán sản phẩm PRO</title>

<style>
body{font-family:Arial;padding:10px;background:#f5f5f5;}
table{width:100%;border-collapse:collapse;text-align:center;background:white;margin-bottom:15px;}
th,td{border:1px solid #ddd;padding:8px;}
th{background:#4CAF50;color:white;}
input{width:100%;height:35px;text-align:center;font-size:16px;}
button{width:100%;height:45px;margin-top:10px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;}
.start-btn{background:#FF9800;color:white;}

<body>

<h2>📊 TÍNH TOÁN SẢN PHẨM PRO</h2>

<!-- Step [1]: Thêm nút điều khiển số lượng cuộn vào giao diện -->
<div class=&quot;box&quot; style=&quot;display: flex; gap: 10px; align-items: center; justify-content: center;&quot;>
  <button onclick=&quot;giamCuon()&quot; style=&quot;background: #f44336; color: white; margin-top: 0; flex: 1;&quot;>- Xóa cuộn bớt</button>
  <span style=&quot;font-size: 18px; font-weight: bold; white-space: nowrap; padding: 0 10px;&quot;>Số cuộn: <span id=&quot;hienThiSoCuon&quot;>3</span></span>
  <button onclick=&quot;tangCuon()&quot; style=&quot;background: #4CAF50; color: white; margin-top: 0; flex: 1;&quot;>+ Thêm cuộn</button>
</div>

<!-- Step [2]: Cấu trúc lại bảng HTML để hỗ trợ render động -->
<table>
<tr id=&quot;hangTieuDe&quot;></tr>
<tr id=&quot;hangRa&quot;></tr>
<tr id=&quot;hangLam&quot;></tr>
<tr id=&quot;hangHong&quot;></tr>
</table>

<div class=&quot;percent-box&quot;>
Phần trăm làm được: <span id=&quot;phanTram&quot;>0</span>%
</div>

<div class=&quot;box&quot;>
<h3>📈 Nhập theo % (Tự sinh thông minh)</h3>

<label>Tổng làm được (có thể bỏ trống):</label>
<input id=&quot;lamTongNhap&quot; type=&quot;number&quot;>

<label>Phần trăm trung bình (%):</label>
<input id=&quot;phanTramNhap&quot; type=&quot;number&quot; step=&quot;0.1&quot;>

<button class=&quot;start-btn&quot; onclick=&quot;tinhNguoc()&quot;>🚀 BẮT ĐẦU TỰ SINH</button>
<button class=&quot;save-btn&quot; onclick=&quot;luuDuLieu()&quot;>💾 LƯU DỮ LIỆU</button>
<button class=&quot;clear-btn&quot; onclick=&quot;xoaTatCa()&quot;>🗑️ XÓA TẤT CẢ</button>
</div>

<h3>📋 Dữ liệu đã lưu</h3>
<div id=&quot;dsLuu&quot;></div>

<script>

// Step [3]: Viết hàm JavaScript quản lý số lượng cuộn (renderColumns)
let soCuon = 3;

function renderColumns() {
  let currentRa = [];
  let currentLam = [];
  for (let i = 1; i <= 100; i++) {
    let r = document.getElementById(`ra_${i}`);
    let l = document.getElementById(`lam_${i}`);
    if (r) currentRa[i] = r.value;
    if (l) currentLam[i] = l.value;
  }

  let headerHtml = &apos;<th></th>&apos;;
  for (let i = 1; i <= soCuon; i++) {
    headerHtml += `<th>Cuộn ${i}</th>`;
  }
  headerHtml += &apos;<th>Tổng</th>&apos;;
  document.getElementById(&quot;hangTieuDe&quot;).innerHTML = headerHtml;

  let raHtml = &apos;<td>Hàng ra</td>&apos;;
  for (let i = 1; i <= soCuon; i++) {
    raHtml += `<td><input id=&quot;ra_${i}&quot; type=&quot;number&quot; oninput=&quot;tinhToan()&quot;></td>`;
  }
  raHtml += &apos;<td id=&quot;tongRa&quot;>0</td>&apos;;
  document.getElementById(&quot;hangRa&quot;).innerHTML = raHtml;

  let lamHtml = &apos;<td>Hàng làm</td>&apos;;
  for (let i = 1; i <= soCuon; i++) {
    lamHtml += `<td><input id=&quot;lam_${i}&quot; type=&quot;number&quot; oninput=&quot;tinhToan()&quot;></td>`;
  }
  lamHtml += &apos;<td id=&quot;tongLam&quot;>0</td>&apos;;
  document.getElementById(&quot;hangLam&quot;).innerHTML = lamHtml;

  let hongHtml = &apos;<td>Hàng hỏng</td>&apos;;
  for (let i = 1; i <= soCuon; i++) {
    hongHtml += `<td id=&quot;hong_${i}&quot;>0</td>`;
  }
  hongHtml += &apos;<td id=&quot;tongHong&quot;>0</td>&apos;;
  document.getElementById(&quot;hangHong&quot;).innerHTML = hongHtml;

  for (let i = 1; i <= soCuon; i++) {
    if (currentRa[i] !== undefined) {
      let rInput = document.getElementById(`ra_${i}`);
      if (rInput) rInput.value = currentRa[i];
    }
    if (currentLam[i] !== undefined) {
      let lInput = document.getElementById(`lam_${i}`);
      if (lInput) lInput.value = currentLam[i];
    }
  }

  document.getElementById(&quot;hienThiSoCuon&quot;).innerText = soCuon;
  tinhToan();
}

function tangCuon() {
  soCuon++;
  renderColumns();
}

function giamCuon() {
  if (soCuon > 1) {
    soCuon--;
    renderColumns();
  } else {
    alert(&quot;Phải có ít nhất 1 cuộn!&quot;);
  }
}

// Step [4]: Cập nhật hàm tính toán tinhToan() theo số lượng cuộn động
function tinhToan(){
  let tongRa = 0;
  let tongLam = 0;

  for (let i = 1; i <= soCuon; i++) {
    let rInput = document.getElementById(`ra_${i}`);
    let lInput = document.getElementById(`lam_${i}`);
    let r = rInput ? (+rInput.value || 0) : 0;
    let l = lInput ? (+lInput.value || 0) : 0;

    tongRa += r;
    tongLam += l;

    let hCell = document.getElementById(`hong_${i}`);
    if (hCell) {
      hCell.innerText = Math.max(0, r - l);
    }
  }

  document.getElementById(&quot;tongRa&quot;).innerText = tongRa;
  document.getElementById(&quot;tongLam&quot;).innerText = tongLam;
  document.getElementById(&quot;tongHong&quot;).innerText = Math.max(0, tongRa - tongLam);

  document.getElementById(&quot;phanTram&quot;).innerText = tongRa ? (tongLam / tongRa * 100).toFixed(2) : 0;
}

// Step [5]: Cập nhật hàm tự sinh thông minh tinhNguoc() với sai số chính xác từ 0.01% đến 0.1%
function tinhNguoc(){
  const lamTongNhapRaw = document.getElementById(&quot;lamTongNhap&quot;).value;
  const lamTongNhap = lamTongNhapRaw.trim() === &quot;&quot; ? (soCuon * 150) : +lamTongNhapRaw;
  const pTB = +document.getElementById(&quot;phanTramNhap&quot;).value;

  if(!pTB){
    alert(&quot;Nhập % trung bình trước!&quot;);
    return;
  }

  if(pTB <= 0 || pTB > 100){
    alert(&quot;Phần trăm phải từ 0-100&quot;);
    return;
  }

  /*
   * QUAN TRỌNG:
   * - Giá trị nào người dùng đã nhập từ trước sẽ được đánh dấu là &quot;cố định&quot;.
   * - BẮT ĐẦU TỰ SINH chỉ được phép điền/chỉnh các ô còn trống.
   * - Không scale, cộng, trừ hoặc thay đổi bất kỳ ô nào đã nhập.
   */
  const rows = [];
  const generated = [];
  let fixedLamTotal = 0;
  let hasEmpty = false;

  for(let i = 1; i <= soCuon; i++){
    const rInput = document.getElementById(`ra_${i}`);
    const lInput = document.getElementById(`lam_${i}`);

    const rRaw = rInput ? rInput.value.trim() : &quot;&quot;;
    const lRaw = lInput ? lInput.value.trim() : &quot;&quot;;

    const rEntered = rRaw !== &quot;&quot;;
    const lEntered = lRaw !== &quot;&quot;;

    const row = {
      i,
      rInput,
      lInput,
      r: rEntered ? +rRaw : null,
      l: lEntered ? +lRaw : null,
      rEntered,
      lEntered,
      rGenerated: false,
      lGenerated: false
    };

    if(lEntered) fixedLamTotal += row.l;

    // Chỉ sinh ô còn thiếu. Ô đã nhập tuyệt đối không sửa.
    if(rEntered &amp;&amp; !lEntered){
      row.l = Math.max(0, Math.round(row.r * (pTB / 100)));
      lInput.value = row.l;
      row.lGenerated = true;
      hasEmpty = true;
    }
    else if(!rEntered &amp;&amp; lEntered){
      let percent = pTB + (Math.random() * 2 - 1);
      percent = Math.max(85, Math.min(100, percent));
      row.r = Math.max(row.l, Math.round(row.l / (percent / 100)));
      rInput.value = row.r;
      row.rGenerated = true;
      hasEmpty = true;
    }
    else if(!rEntered &amp;&amp; !lEntered){
      // Cả Hàng ra và Hàng làm đều trống = 0.
      // Không tự sinh dữ liệu cho cuộn này và không đưa vào phép điều chỉnh %.
      row.r = 0;
      row.l = 0;
      if(rInput) rInput.value = 0;
      if(lInput) lInput.value = 0;
    }

    rows.push(row);
  }

  // Các cuộn để trống cả hai ô được xem là 0 và không được tự sinh.
  // Chỉ những cuộn đã nhập một bên mới được bổ sung ô còn thiếu.

  // Danh sách tất cả các ô được phép điều chỉnh sau khi sinh.
  // Không bao giờ đưa ô người dùng đã nhập vào danh sách này.
  const adjustable = rows.filter(row => row.rGenerated || row.lGenerated);

  // Nếu tất cả các ô đều đã nhập thì không có gì để tự sinh/chỉnh.
  if(!hasEmpty || adjustable.length === 0){
    tinhToan();
    return;
  }

  /*
   * Điều chỉnh % cuối cùng.
   * Chỉ thay đổi ô được tự sinh ở trên.
   * Ưu tiên chỉnh Hàng ra nếu Hàng ra là ô tự sinh;
   * nếu Hàng ra là giá trị người dùng nhập thì chỉnh Hàng làm.
   */
  let attempts = 0;
  while(attempts < 10000){
    let tongRa = 0;
    let tongLam = 0;

    rows.forEach(row => {
      tongRa += +row.rInput.value || 0;
      tongLam += +row.lInput.value || 0;
    });

    if(tongRa === 0) break;

    const pct = (tongLam / tongRa) * 100;
    const diff = pct - pTB;
    const absDiff = Math.abs(diff);

    // Giữ đúng logic sai số cũ: 0.01% đến 0.1%.
    if(absDiff >= 0.01 &amp;&amp; absDiff <= 0.1) break;

    let changed = false;

    // Nếu % thấp hơn mục tiêu: tăng Làm hoặc giảm Ra.
    if(diff < 0){
      const rRows = adjustable.filter(row => row.rGenerated &amp;&amp; (+row.rInput.value || 0) > (+row.lInput.value || 0));
      if(rRows.length > 0){
        const row = rRows[Math.floor(Math.random() * rRows.length)];
        row.rInput.value = Math.max(+row.lInput.value || 0, (+row.rInput.value || 0) - 1);
        changed = true;
      }else{
        const lRows = adjustable.filter(row => row.lGenerated);
        if(lRows.length > 0){
          const row = lRows[Math.floor(Math.random() * lRows.length)];
          row.lInput.value = (+row.lInput.value || 0) + 1;
          changed = true;
        }
      }
    }
    // Nếu % cao hơn mục tiêu: giảm Làm hoặc tăng Ra.
    else{
      const lRows = adjustable.filter(row => row.lGenerated &amp;&amp; (+row.lInput.value || 0) > 0);
      if(lRows.length > 0){
        const row = lRows[Math.floor(Math.random() * lRows.length)];
        row.lInput.value = Math.max(0, (+row.lInput.value || 0) - 1);
        changed = true;
      }else{
        const rRows = adjustable.filter(row => row.rGenerated);
        if(rRows.length > 0){
          const row = rRows[Math.floor(Math.random() * rRows.length)];
          row.rInput.value = (+row.rInput.value || 0) + 1;
          changed = true;
        }
      }
    }

    if(!changed) break;
    attempts++;
  }

  tinhToan();
}

// Step [6]: Cập nhật cấu trúc lưu trữ LocalStorage và hiển thị lịch sử
function luuDuLieu(){
  let raArr = [];
  let lamArr = [];
  let hasData = false;

  for (let i = 1; i <= soCuon; i++) {
    let rVal = document.getElementById(`ra_${i}`) ? document.getElementById(`ra_${i}`).value : &quot;&quot;;
    let lVal = document.getElementById(`lam_${i}`) ? document.getElementById(`lam_${i}`).value : &quot;&quot;;
    raArr.push(rVal || 0);
    lamArr.push(lVal || 0);
    if (rVal || lVal) hasData = true;
  }

  if(!hasData){
    alert(&quot;Không có dữ liệu để lưu!&quot;);
    return;
  }

  let tongRa = raArr.reduce((a, b) => (+a) + (+b), 0);
  let tongLam = lamArr.reduce((a, b) => (+a) + (+b), 0);
  let tongHong = Math.max(0, tongRa - tongLam);
  let phanTram = tongRa ? (tongLam/tongRa*100).toFixed(2) : 0;

  let data={
    soCuon,
    ra: raArr,
    lam: lamArr,
    lamTongNhap: document.getElementById(&quot;lamTongNhap&quot;).value,
    phanTramNhap: document.getElementById(&quot;phanTramNhap&quot;).value,
    tongRa,
    tongLam,
    tongHong,
    phanTram,
    time:new Date().toLocaleString()
  };

  let ds=JSON.parse(localStorage.getItem(&quot;tonghang&quot;))||[];
  ds.unshift(data);
  localStorage.setItem(&quot;tonghang&quot;,JSON.stringify(ds));
  hienThi();
  alert(&quot;Đã lưu!&quot;);
}

function hienThi(){
  let ds=JSON.parse(localStorage.getItem(&quot;tonghang&quot;))||[];
  let dsLuu = document.getElementById(&quot;dsLuu&quot;);
  dsLuu.innerHTML=&quot;&quot;;

  if(ds.length===0){
    dsLuu.innerHTML=&quot;Chưa có dữ liệu&quot;;
    return;
  }

  ds.forEach((d,i)=>{
    let raStr = Array.isArray(d.ra) ? d.ra.join(&apos;/&apos;) : `${d.ra1 || 0}/${d.ra2 || 0}/${d.ra3 || 0}`;
    let lamStr = Array.isArray(d.lam) ? d.lam.join(&apos;/&apos;) : `${d.lam1 || 0}/${d.lam2 || 0}/${d.lam3 || 0}`;

    dsLuu.innerHTML+=`
    <div class=&quot;saved-item&quot; onclick=&quot;khoiPhuc(${i})&quot; style=&quot;cursor:pointer;&quot;>
    <span>📅 ${d.time}<br>
    <small>
    Ra: ${raStr} → Tổng: ${d.tongRa}<br>
    Làm: ${lamStr} → Tổng: ${d.tongLam}<br>
    Hỏng: ${d.tongHong} | %: ${d.phanTram}%
    </small>
    </span>
    <span class=&quot;delete&quot; onclick=&quot;xoa(${i})&quot;>❌</span>
    </div>`;
  });
}

function khoiPhuc(i){
  let ds=JSON.parse(localStorage.getItem(&quot;tonghang&quot;))||[];
  let d=ds[i];
  if(!d) return;

  // Khôi phục số cuộn trước để tạo đúng số ô
  soCuon = d.soCuon || (Array.isArray(d.ra) ? d.ra.length : 3);
  renderColumns();

  // Khôi phục toàn bộ giá trị đã nhập tại thời điểm lưu
  for(let j=1; j<=soCuon; j++){
    let rInput=document.getElementById(`ra_${j}`);
    let lInput=document.getElementById(`lam_${j}`);
    if(rInput) rInput.value = Array.isArray(d.ra) ? (d.ra[j-1] ?? &quot;&quot;) : &quot;&quot;;
    if(lInput) lInput.value = Array.isArray(d.lam) ? (d.lam[j-1] ?? &quot;&quot;) : &quot;&quot;;
  }

  // Khôi phục các giá trị nhập ở phần tự sinh
  document.getElementById(&quot;lamTongNhap&quot;).value = d.lamTongNhap ?? &quot;&quot;;
  document.getElementById(&quot;phanTramNhap&quot;).value = d.phanTramNhap ?? &quot;&quot;;

  // Tính lại để bảng hiển thị đúng và tiếp tục chỉnh sửa bình thường
  tinhToan();

  window.scrollTo({top:0, behavior:&quot;smooth&quot;});
  alert(&quot;Đã khôi phục dữ liệu. Bạn có thể sửa tiếp.&quot;);
}

function xoa(i){
  let ds=JSON.parse(localStorage.getItem(&quot;tonghang&quot;))||[];
  ds.splice(i,1);
  localStorage.setItem(&quot;tonghang&quot;,JSON.stringify(ds));
  hienThi();
}

function xoaTatCa(){
  if(!confirm(&quot;Xóa tất cả dữ liệu?&quot;)) return;
  localStorage.removeItem(&quot;tonghang&quot;);
  hienThi();
}

// Khởi tạo giao diện ban đầu
renderColumns();
hienThi();

</script>

    margin-top: 3px;
}
.total {
    font-weight: bold;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px solid #3498db;
    color: #2c3e50;
    font-size: 16px;
}
#grandTotal {
    background: linear-gradient(to right, #2c3e50, #34495e);
    color: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
.category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.category-title {
    color: #2c3e50;
    margin: 0;
}
.category-delete {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
}
.empty-state {
    text-align: center;
    color: #7f8c8d;
    padding: 30px;
    font-style: italic;
}
.entry-form {
    background: #f8f9fa;
    padding: 12px;

<body>

<h2>📒 Ghi chép chi tiêu</h2>

<input id=&quot;newCategory&quot; placeholder=&quot;Tên hạng mục mới&quot;>
<div class=&quot;buttons-row&quot;>
    <button class=&quot;add&quot; onclick=&quot;addCategory()&quot;>
        <span class=&quot;icon&quot;>➕</span> Thêm hạng mục
    </button>
</div>

<div class=&quot;buttons-row&quot;>
    <button class=&quot;save&quot; onclick=&quot;exportJSON()&quot;>
        <span class=&quot;icon&quot;>💾</span> Lưu dữ liệu (.json)
    </button>
    <button class=&quot;delete&quot; onclick=&quot;clearAll()&quot;>
        <span class=&quot;icon&quot;>🗑️</span> Xóa toàn bộ dữ liệu
    </button>
</div>

<div id=&quot;categories&quot;></div>
<div id=&quot;grandTotal&quot;>Tổng tất cả: 0</div>

<script>
let data = JSON.parse(localStorage.getItem(&quot;expenses&quot;)) || {};

function save(){ localStorage.setItem(&quot;expenses&quot;, JSON.stringify(data)); }

function addCategory(){
    const name = newCategory.value.trim();
    if(!name) return alert(&quot;Vui lòng nhập tên hạng mục!&quot;);
    if(data[name]) return alert(&quot;Hạng mục đã tồn tại!&quot;);
    
    data[name] = [];
    newCategory.value = &quot;&quot;;
    save(); 
    render();
}

function deleteCategory(cat){
    if(confirm(`Xóa toàn bộ hạng mục &quot;${cat}&quot;?`)){
        delete data[cat];
        save(); 
        render();
    }
}

function addEntry(cat){
    const a = document.getElementById(`amount-${cat}`);
    const n = document.getElementById(`note-${cat}`);
    
    if(!a.value || parseFloat(a.value) <= 0) {
        alert(&quot;Vui lòng nhập số tiền hợp lệ!&quot;);
        a.focus();
        return;
    }

    data[cat].unshift({
        amount: parseFloat(a.value),
        note: n.value,
        time: new Date().toLocaleString(&quot;vi-VN&quot;)
    });
    
    a.value = &quot;&quot;; 
    n.value = &quot;&quot;;
    save(); 
    render();
}

function editEntry(cat, i){
    const e = data[cat][i];
    const amount = prompt(&quot;Sửa số tiền:&quot;, e.amount);
    if(amount === null || amount === &quot;&quot;) return;
    
    const note = prompt(&quot;Sửa ghi chú:&quot;, e.note);
    e.amount = parseFloat(amount);
    e.note = note;
    e.time = new Date().toLocaleString(&quot;vi-VN&quot;) + &quot; (đã sửa)&quot;;
    
    save(); 
    render();
}

function deleteEntry(cat, i){
    if(confirm(&quot;Xóa khoản chi này?&quot;)){
        data[cat].splice(i,1);
        save(); 
        render();
    }
}

function clearAll(){
    if(confirm(&quot;Bạn có chắc chắn muốn XÓA TOÀN BỘ dữ liệu không?\nHành động này không thể hoàn tác!&quot;)){
        data = {};
        save(); 
        render();
    }
}

function exportJSON(){
    if(Object.keys(data).length === 0) {
        alert(&quot;Không có dữ liệu để xuất!&quot;);
        return;
    }
    
    const blob = new Blob([JSON.stringify(data,null,2)],{type:&quot;application/json&quot;});
    const a = document.createElement(&quot;a&quot;);
    a.href = URL.createObjectURL(blob);
    a.download = `chi_tieu_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    
    alert(&quot;Dữ liệu đã được xuất thành công!&quot;);
}

function render(){
    const c = document.getElementById(&quot;categories&quot;);
    c.innerHTML = &quot;&quot;;
    let grand = 0;

    if(Object.keys(data).length === 0) {
        c.innerHTML = `<div class=&quot;empty-state&quot;>Chưa có hạng mục nào. Hãy thêm hạng mục đầu tiên!</div>`;
        document.getElementById(&quot;grandTotal&quot;).innerText = &quot;Tổng tất cả: 0&quot;;
        return;
    }

    for(let cat in data){
        let sum = 0;
        let html = `<div class=&quot;category&quot;>
            <div class=&quot;category-header&quot;>
                <h3 class=&quot;category-title&quot;>${cat}</h3>
                <button class=&quot;delete category-delete&quot; onclick=&quot;deleteCategory(&apos;${cat}&apos;)&quot;>
                    <span class=&quot;icon&quot;>🗑️</span> Xóa hạng mục
                </button>
            </div>
            
            <div class=&quot;entry-form&quot;>
                <input id=&quot;amount-${cat}&quot; type=&quot;number&quot; placeholder=&quot;Số tiền&quot; min=&quot;1&quot;>
                <textarea id=&quot;note-${cat}&quot; placeholder=&quot;Ghi chú (có thể bỏ qua)&quot; rows=&quot;2&quot;></textarea>
                <button class=&quot;add&quot; onclick=&quot;addEntry(&apos;${cat}&apos;)&quot;>
                    <span class=&quot;icon&quot;>➕</span> Thêm khoản chi
                </button>
            </div>`;

        if(data[cat].length === 0) {
            html += `<div class=&quot;empty-state&quot;>Chưa có khoản chi nào trong hạng mục này</div>`;
        } else {
            data[cat].forEach((e,i)=>{
                sum += e.amount;
                html += `<div class=&quot;entry&quot;>
                    <div class=&quot;entry-content&quot;>
                        <div class=&quot;entry-amount&quot;>💰 ${e.amount.toLocaleString()} VND</div>
                        ${e.note ? `<div class=&quot;entry-note&quot;>📝 ${e.note}</div>` : &quot;&quot;}
                        <div class=&quot;entry-time&quot;>⏰ ${e.time}</div>
                    </div>
                    <div class=&quot;entry-actions&quot;>
                        <button class=&quot;edit&quot; onclick=&quot;editEntry(&apos;${cat}&apos;,${i})&quot;>
                            <span class=&quot;icon&quot;>✏️</span> Sửa
                        </button>
                        <button class=&quot;delete&quot; onclick=&quot;deleteEntry(&apos;${cat}&apos;,${i})&quot;>
                            <span class=&quot;icon&quot;>❌</span> Xóa
                        </button>
                    </div>
                </div>`;
            });
        }

        grand += sum;
        html += `<div class=&quot;total&quot;>Tổng ${cat}: <span style=&quot;color:#27ae60&quot;>${sum.toLocaleString()} VND</span></div></div>`;
        c.innerHTML += html;
    }
    
    document.getElementById(&quot;grandTotal&quot;).innerText = `Tổng tất cả: ${grand.toLocaleString()} VND`;
}

// Khởi chạy ứng dụng
document.addEventListener(&apos;DOMContentLoaded&apos;, function() {
    render();
    
    // Thêm sự kiện nhấn Enter để thêm hạng mục
    document.getElementById(&apos;newCategory&apos;).addEventListener(&apos;keypress&apos;, function(e) {
        if(e.key === &apos;Enter&apos;) addCategory();
    });
});
</script>
</body>
</html>"></iframe>

<style>

<body>
<h2>TÍNH LƯƠNG NHÂN VIÊN</h2>

<label>Lương cơ bản (won/giờ):</label><br>
<input type=&quot;number&quot; id=&quot;baseRate&quot; value=&quot;10300&quot;><br>

<label>Số ngày làm CA NGÀY:</label><br>
<input type=&quot;number&quot; id=&quot;dayShiftDays&quot; min=&quot;0&quot;><br>

<label>Số ngày làm CA ĐÊM (19h – 6h):</label><br>
<input type=&quot;number&quot; id=&quot;nightShiftDays&quot; min=&quot;0&quot;><br>

<hr>

<label>Số ngày làm thứ 7:</label><br>
<input type=&quot;number&quot; id=&quot;saturday8h&quot; placeholder=&quot;8 tiếng&quot;>
<input type=&quot;number&quot; id=&quot;saturday10h&quot; placeholder=&quot;10 tiếng&quot;><br>

<label>Số ngày làm chủ nhật:</label><br>
<input type=&quot;number&quot; id=&quot;sunday8h&quot; placeholder=&quot;8 tiếng&quot;>
<input type=&quot;number&quot; id=&quot;sunday10h&quot; placeholder=&quot;10 tiếng&quot;><br>

<label>Số chuyên cần (1 = 82400 won):</label><br>
<input type=&quot;number&quot; id=&quot;attendanceBonusCount&quot; min=&quot;0&quot;><br>

<button onclick=&quot;calculateSalary()&quot;>TÍNH LƯƠNG</button>

<div id=&quot;salaryDetails&quot;></div>

<div class=&quot;note&quot;>
<strong>Ghi chú:</strong><br>
Tiền thuế tùy năm nếu làm 3 năm trở nên 1 năm nhận 2 triệu won thì mỗi tháng trừ gần 170k won
</div>

<script>
function calculateSalary() {

const rate = +document.getElementById(&quot;baseRate&quot;).value || 10320;
const taxRate = 0.05;

// CA NGÀY (8h thường + 2h tăng ca)
const dayShiftSalary = (8 * rate) + (2 * rate * 1.5);

// CA ĐÊM (3h thường + 7.5h đêm ×1.5)
const nightShiftSalary = (3 * rate) + (7.5 * rate * 1.5);

// Thứ 7 &amp; CN
const sat8 = 8 * rate * 1.5;
const sat10 = 10 * rate * 1.5;
const sun8 = 8 * rate * 1.5;
const sun10 = 10 * rate * 1.5;

const attendanceUnit = 82400;

// Input
let dayDays = +dayShiftDays.value || 0;
let nightDays = +nightShiftDays.value || 0;
let sat8d = +saturday8h.value || 0;
let sat10d = +saturday10h.value || 0;
let sun8d = +sunday8h.value || 0;
let sun10d = +sunday10h.value || 0;
let attendance = +attendanceBonusCount.value || 0;

// Tính
let dayTotal = dayDays * dayShiftSalary;
let nightTotal = nightDays * nightShiftSalary;

let total =
dayTotal + nightTotal +
sat8d * sat8 + sat10d * sat10 +
sun8d * sun8 + sun10d * sun10 +
attendance * attendanceUnit;

let tax = total * taxRate;
let net = total - tax;

// Hiển thị
salaryDetails.innerHTML = `
<table>
<tr><th>Khoản</th><th>Tiền (won)</th></tr>
<tr><td>Ca ngày (${dayDays} ngày)</td><td>${dayTotal.toLocaleString()}</td></tr>
<tr><td>Ca đêm (${nightDays} ngày)</td><td>${nightTotal.toLocaleString()}</td></tr>
<tr><td>Thứ 7</td><td>${(sat8d*sat8 + sat10d*sat10).toLocaleString()}</td></tr>
<tr><td>Chủ nhật</td><td>${(sun8d*sun8 + sun10d*sun10).toLocaleString()}</td></tr>
<tr><td>Chuyên cần</td><td>${(attendance*attendanceUnit).toLocaleString()}</td></tr>
<tr><th>Tổng trước thuế</th><th>${total.toLocaleString()}</th></tr>
<tr><td>Thuế 5%</td><td>${tax.toLocaleString()}</td></tr>
<tr><th>Thực nhận</th><th>${net.toLocaleString()}</th></tr>
</table>`;
}
</script>
